name: ExamPortal CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ExamPortal.sln

      - name: Build solution
        run: dotnet build ExamPortal.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ExamPortal.sln --configuration Release --no-build

      - name: Publish application
        run: dotnet publish ExamPortal.csproj --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPortal-build
          path: ./publish
